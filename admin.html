<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFC Hub | لوحة التحكم</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f4f6fa;
      color: #182230;
    }

    button, input {
      font: inherit;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      background: #172033;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #dce2ec;
      border-radius: 10px;
      background: white;
    }

    label {
      display: block;
      margin-top: 15px;
      font-size: 13px;
    }

    h1, h2, p {
      margin-top: 0;
    }

    h1 {
      font-size: 25px;
    }

    h2 {
      font-size: 19px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 22px;
    }

    .card {
      background: white;
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid #e6eaf1;
      border-radius: 18px;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color: #778196;
      font-size: 13px;
      line-height: 1.8;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #172033;
      color: white;
      font-size: 24px;
      font-weight: bold;
    }

    .brand h1 {
      margin: 0;
    }

    .brand p {
      margin: 5px 0 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat {
      background: white;
      border: 1px solid #e6eaf1;
      border-radius: 15px;
      padding: 18px;
    }

    .stat span {
      color: #778196;
      font-size: 13px;
    }

    .stat strong {
      display: block;
      margin-top: 10px;
      font-size: 28px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 16px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    .secondary {
      background: #edf0f6;
      color: #172033;
    }

    .danger {
      background: #fff0f0;
      color: #b42318;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #eef8f0;
      color: #18733a;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .error {
      background: #fff0f0;
      color: #b42318;
    }

    .shop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      padding: 16px 0;
      border-bottom: 1px solid #edf0f5;
    }

    .shop:last-child {
      border-bottom: 0;
    }

    .shop-name {
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .shop-info {
      min-width: 0;
    }

    .shop-info small {
      display: block;
      margin-top: 7px;
      color: #778196;
      overflow-wrap: anywhere;
    }

    .shop-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .shop-actions button {
      padding: 9px 12px;
      font-size: 12px;
    }

    .empty {
      padding: 25px 0;
      color: #778196;
      text-align: center;
    }

    a {
      color: #3155a6;
      overflow-wrap: anywhere;
    }

    @media (max-width: 650px) {
      .container {
        padding: 12px;
      }

      .card {
        padding: 16px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .shop {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
<div class="container">

  <header class="brand">
    <div class="logo">N</div>
    <div>
      <h1>NFC Hub</h1>
      <p class="muted">لوحة الإدارة الخاصة</p>
    </div>
  </header>

  <!-- تسجيل الدخول -->
  <section id="loginCard" class="card">
    <h2>تسجيل دخول الإدارة</h2>
    <p class="muted">
      سجّل الدخول باستخدام حساب الإدارة الذي أنشأته في Supabase.
    </p>

    <form id="loginForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">كلمة المرور</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <div class="actions">
        <button id="loginBtn" type="submit">دخول</button>
      </div>
    </form>

    <div id="loginStatus" class="status hidden"></div>
  </section>

  <!-- لوحة الإدارة -->
  <main id="dashboard" class="hidden">

    <div class="actions" style="margin-bottom:20px">
      <button id="logoutBtn" class="secondary">تسجيل الخروج</button>
    </div>

    <section class="stats">
      <div class="stat">
        <span>إجمالي المحلات</span>
        <strong id="totalCount">0</strong>
      </div>

      <div class="stat">
        <span>محلات لديها رقم تواصل</span>
        <strong id="phoneCount">0</strong>
      </div>

      <div class="stat">
        <span>محلات لديها روابط</span>
        <strong id="linksCount">0</strong>
      </div>
    </section>

    <!-- إضافة وتعديل المحلات -->
    <section class="card">
      <h2 id="formTitle">إضافة محل جديد</h2>

      <form id="shopForm">
        <input id="shopId" type="hidden">

        <div class="form-grid">
          <div>
            <label for="storeName">اسم المحل *</label>
            <input id="storeName" required
                   placeholder="مثال: ديوانية مخمل">
          </div>

          <div>
            <label for="phone">رقم التواصل</label>
            <input id="phone" type="tel"
                   placeholder="05xxxxxxxx">
          </div>

          <div>
            <label for="menuUrl">رابط المنيو</label>
            <input id="menuUrl" type="url"
                   placeholder="https://...">
          </div>

          <div>
            <label for="mapUrl">رابط Google Maps</label>
            <input id="mapUrl" type="url"
                   placeholder="https://...">
          </div>

          <div style="grid-column:1/-1">
            <label for="socialUrl">رابط حساب المحل</label>
            <input id="socialUrl" type="url"
                   placeholder="https://instagram.com/...">
          </div>
        </div>

        <div class="actions">
          <button id="saveBtn" type="submit">حفظ المحل</button>
          <button id="resetBtn" class="secondary" type="button">
            محل جديد
          </button>
        </div>
      </form>

      <div id="formStatus" class="status hidden"></div>
    </section>

    <!-- قائمة المحلات -->
    <section class="card">
      <h2>المحلات المسجلة</h2>

      <p class="muted">
        من هنا تقدر تعرض بيانات كل محل وتعدّلها أو تحذفها.
      </p>

      <div class="actions">
        <button id="refreshBtn" class="secondary" type="button">
          تحديث القائمة
        </button>
      </div>

      <div id="listStatus" class="status hidden"></div>
      <div id="shopsList"></div>
    </section>

  </main>
</div>

<script>
/* ==========================================
   إعدادات Supabase
   استخدم Project URL والمفتاح العام Publishable
   لا تستخدم Service Role Key هنا.
========================================== */

const SUPABASE_URL =
  'https://mwpeycqflokjlwwhtlte.supabase.co/rest/v1/';

const SUPABASE_KEY =
  'sb_publishable_CRRpmEutt5d86meO07bMPw_N4WE6GVr';

/* ==========================================
   لا تحتاج إلى تعديل ما تحت هذا السطر
========================================== */

const $ = id => document.getElementById(id);

let db = null;

function showStatus(id, text, error = false) {
  const el = $(id);

  el.textContent = text;
  el.classList.remove('hidden', 'error');

  if (error) {
    el.classList.add('error');
  }
}

function hideStatus(id) {
  $(id).classList.add('hidden');
}

function initializeSupabase() {
  if (!window.supabase) {
    showStatus(
      'loginStatus',
      'تعذّر تحميل Supabase. تأكد من اتصال الإنترنت.',
      true
    );
    return false;
  }

  if (
    SUPABASE_URL.includes('PUT_YOUR') ||
    SUPABASE_KEY.includes('PUT_YOUR')
  ) {
    showStatus(
      'loginStatus',
      'أدخل رابط مشروع Supabase والمفتاح العام في أعلى الكود.',
      true
    );
    return false;
  }

  db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  return true;
}

function showDashboard(isLoggedIn) {
  $('loginCard').classList.toggle(
    'hidden',
    isLoggedIn
  );

  $('dashboard').classList.toggle(
    'hidden',
    !isLoggedIn
  );

  if (isLoggedIn) {
    loadShops();
  }
}

function safeUrl(value) {
  if (!value) return null;

  try {
    const url = new URL(value);

    if (
      url.protocol !== 'https:' &&
      url.protocol !== 'http:'
    ) {
      return null;
    }

    return url.href;
  } catch {
    return null;
  }
}

function resetForm() {
  $('shopForm').reset();
  $('shopId').value = '';

  $('formTitle').textContent = 'إضافة محل جديد';
  $('saveBtn').textContent = 'حفظ المحل';

  hideStatus('formStatus');
}

function editShop(shop) {
  $('shopId').value = shop.id;
  $('storeName').value = shop.store_name || '';
  $('phone').value = shop.phone || '';
  $('menuUrl').value = shop.menu_url || '';
  $('mapUrl').value = shop.map_url || '';
  $('socialUrl').value = shop.instagram_url || '';

  $('formTitle').textContent =
    'تعديل: ' + shop.store_name;

  $('saveBtn').textContent = 'حفظ التعديلات';

  hideStatus('formStatus');

  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
}

async function loadShops() {
  if (!db) return;

  $('shopsList').replaceChildren();

  showStatus(
    'listStatus',
    'جاري تحميل المحلات...'
  );

  const { data, error } = await db
    .from('clients')
    .select(
      'id,store_name,phone,menu_url,map_url,instagram_url'
    )
    .order('store_name', { ascending: true });

  if (error) {
    showStatus(
      'listStatus',
      'تعذّر تحميل المحلات:\n' +
      error.message +
      '\nتأكد من اسم الجدول والأعمدة وصلاحيات RLS.',
      true
    );
    return;
  }

  hideStatus('listStatus');

  $('totalCount').textContent = data.length;

  $('phoneCount').textContent =
    data.filter(shop => shop.phone).length;

  $('linksCount').textContent =
    data.filter(shop =>
      shop.menu_url ||
      shop.map_url ||
      shop.instagram_url
    ).length;

  if (data.length === 0) {
    const empty = document.createElement('div');

    empty.className = 'empty';
    empty.textContent =
      'ما فيه محلات مسجلة. أضف أول محل من النموذج.';

    $('shopsList').appendChild(empty);
    return;
  }

  data.forEach(shop => {
    const row = document.createElement('div');
    row.className = 'shop';

    const info = document.createElement('div');
    info.className = 'shop-info';

    const name = document.createElement('div');
    name.className = 'shop-name';
    name.textContent = shop.store_name || 'محل بدون اسم';

    const phone = document.createElement('small');
    phone.textContent =
      'رقم التواصل: ' + (shop.phone || 'غير مضاف');

    info.append(name, phone);

    const links = document.createElement('div');
    links.className = 'shop-info';

    addLink(links, 'المنيو', shop.menu_url);
    addLink(links, 'الموقع', shop.map_url);
    addLink(links, 'الحساب', shop.instagram_url);

    const actions = document.createElement('div');
    actions.className = 'shop-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'secondary';
    editBtn.textContent = 'تعديل';
    editBtn.type = 'button';
    editBtn.onclick = () => editShop(shop);

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'danger';
    deleteBtn.textContent = 'حذف';
    deleteBtn.type = 'button';
    deleteBtn.onclick = () => deleteShop(shop);

    actions.append(editBtn, deleteBtn);
    row.append(info, links, actions);

    $('shopsList').appendChild(row);
  });
}

function addLink(container, label, value) {
  if (!value) return;

  const url = safeUrl(value);
  if (!url) return;

  const link = document.createElement('a');

  link.href = url;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.textContent = label;

  link.style.marginLeft = '10px';

  container.appendChild(link);
}

$('loginForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!db && !initializeSupabase()) return;

  $('loginBtn').disabled = true;

  showStatus(
    'loginStatus',
    'جاري تسجيل الدخول...'
  );

  const { error } = await db.auth.signInWithPassword({
    email: $('email').value.trim(),
    password: $('password').value
  });

  $('loginBtn').disabled = false;

  if (error) {
    showStatus(
      'loginStatus',
      'تعذّر تسجيل الدخول: ' + error.message,
      true
    );
    return;
  }

  hideStatus('loginStatus');
  showDashboard(true);
});

$('shopForm').addEventListener('submit', async event => {
  event.preventDefault();

  if (!db) return;

  const id = $('shopId').value;

  const payload = {
    store_name: $('storeName').value.trim(),
    phone: $('phone').value.trim() || null,
    menu_url: safeUrl($('menuUrl').value.trim()),
    map_url: safeUrl($('mapUrl').value.trim()),
    instagram_url: safeUrl($('socialUrl').value.trim())
  };

  if (!payload.store_name) {
    showStatus(
      'formStatus',
      'اكتب اسم المحل أولًا.',
      true
    );
    return;
  }

  $('saveBtn').disabled = true;

  let result;

  if (id) {
    result = await db
      .from('clients')
      .update(payload)
      .eq('id', id);
  } else {
    result = await db
      .from('clients')
      .insert(payload);
  }

  $('saveBtn').disabled = false;

  if (result.error) {
    showStatus(
      'formStatus',
      'لم يتم الحفظ:\n' + result.error.message,
      true
    );
    return;
  }

  showStatus(
    'formStatus',
    id
      ? 'تم تحديث بيانات المحل بنجاح.'
      : 'تمت إضافة المحل بنجاح.'
  );

  resetForm();
  await loadShops();
});

async function deleteShop(shop) {
  const confirmed = confirm(
    'هل أنت متأكد أنك تريد حذف محل ' +
    shop.store_name +
    '؟'
  );

  if (!confirmed) return;

  const { error } = await db
    .from('clients')
    .delete()
    .eq('id', shop.id);

  if (error) {
    showStatus(
      'listStatus',
      'تعذّر الحذف: ' + error.message,
      true
    );
    return;
  }

  await loadShops();

  showStatus(
    'listStatus',
    'تم حذف المحل بنجاح.'
  );
}

$('logoutBtn').addEventListener('click', async () => {
  if (db) {
    await db.auth.signOut();
  }

  showDashboard(false);
  resetForm();
});

$('resetBtn').addEventListener('click', resetForm);
$('refreshBtn').addEventListener('click', loadShops);

if (initializeSupabase()) {
  db.auth.getSession().then(({ data, error }) => {
    if (error) {
      showStatus('loginStatus', error.message, true);
      return;
    }

    if (data.session) {
      showDashboard(true);
    }
  });

  db.auth.onAuthStateChange((_event, session) => {
    if (!session) {
      showDashboard(false);
    }
  });
}
</script>
</body>
</html>
